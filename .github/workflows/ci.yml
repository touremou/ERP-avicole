name: CI

on:
  push:            # toutes les branches : la dérive vendor/Blade doit casser AVANT la PR
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, gd, bcmath, intl, zip, sodium, pdo_sqlite, sqlite3
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Compile all Blade views
        # Compile TOUT le Blade (équivalent CI du réflexe local `view:cache`) :
        # attrape les composants/props cassés sans attendre qu'un test rende la vue.
        run: php artisan view:cache

      - name: Install & build front-end assets
        run: |
          npm ci
          npm run build

      - name: Validate migrations on a fresh database
        # Garantit que toute la chaîne de migrations s'applique proprement.
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan migrate --force

      - name: Run test suite
        # phpunit.xml force sqlite :memory: + APP_ENV=testing.
        run: php artisan test

  mysql:
    # PARITÉ PROD. La suite tourne sur sqlite ; la production est MySQL 8. Ce job
    # garantissait déjà que la chaîne de migrations se construit et se rejoue sur
    # MySQL — mais AUCUN test ne s'y exécutait, si bien qu'une différence de
    # comportement entre les deux moteurs restait invisible.
    #
    # Ce n'est pas théorique : sqlite n'applique pas les types de colonnes. Une
    # colonne DATE y accepte « 2026-07-31 00:00:00 » et le compare comme du texte,
    # là où MySQL stocke « 2026-07-31 ». Un test a échoué pour cette seule raison,
    # et j'en ai conclu à tort un défaut de production. L'inverse est le vrai
    # danger : un défaut propre à MySQL ne serait vu par personne avant le terrain.
    #
    # La suite s'exécute donc AUSSI sur MySQL. Ce que la CI valide devient ce qui
    # tourne réellement.
    name: Tests + migrations MySQL 8 (parité prod)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: erp_ci
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, gd, bcmath, intl, zip, sodium, pdo_mysql
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build full schema on MySQL 8
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: erp_ci
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate:fresh --force

      - name: Re-run migrate on existing schema (idempotence)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: erp_ci
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate --force

      # Les vues Blade référencent les actifs compilés : sans le manifeste, tout
      # test qui rend une page échoue pour une raison sans rapport avec MySQL.
      - name: Install & build front-end assets
        run: |
          npm ci
          npm run build

      - name: Run test suite ON MYSQL
        # phpunit.xml impose sqlite via <env>, SANS force="true" : une variable
        # déjà présente dans l'environnement l'emporte. C'est ce qui permet de
        # rejouer exactement la même suite sur l'autre moteur, sans la dupliquer.
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: erp_ci
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test
